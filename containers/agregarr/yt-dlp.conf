# yt-dlp configuration for Agregarr trailer downloads.
# The format is constrained at download time so Apple TV can direct-play the
# source even before the post-processor performs its verified fast-start remux.

--cookies /app/config/youtube-cookies.txt

# Mobile clients avoid YouTube SABR/challenge failures for this workload.
--extractor-args "youtube:player_client=android,ios"
--user-agent "Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36"
--referer "https://www.youtube.com/"

# A missing fragment must fail the download. Never publish a partially decoded
# MP4 merely because most fragments were available.
--retries 5
--fragment-retries 5
--abort-on-unavailable-fragments

--merge-output-format mp4
--format "bestvideo[height<=1080][ext=mp4][vcodec^=avc1]+bestaudio[ext=m4a][acodec^=mp4a]/best[height<=1080][ext=mp4][vcodec^=avc1][acodec^=mp4a]"
