networks:
  default:
  vpn_net:

services:
  # ─── VPN client ────────────────────────────────────────────
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      # Key + Address must match a WireGuard config from Proton (account.proton.me → VPN → WireGuard).
      # After regenerating: set WIREGUARD_PRIVATE_KEY and WIREGUARD_ADDRESSES in .env from that file.
      # Leave Moderate NAT disabled there (conflicts with NAT-PMP / port forwarding per Proton + gluetun wiki).
      # Use one key only for this Gluetun; do not reuse the same key on another host/container.
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      # Interface Address= line from the Proton .conf (e.g. 10.2.0.2/32); default keeps prior compose value.
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES:-10.2.0.2/32}
      # If Proton’s .conf includes PresharedKey=, add: WIREGUARD_PRESHARED_KEY=... to .env and a line here.
      # P2P / port-forward servers only (see gluetun ProtonVPN wiki).
      - PORT_FORWARD_ONLY=on
      # Lower latency from Texas; PORT_FORWARD_ONLY still limits to P2P / port-forward POPs.
      # If Gluetun fails to find a server, add fallbacks: United States,Switzerland,Netherlands
      - SERVER_COUNTRIES=United States
      - TZ=${TZ}
      - DOCKER_VPN_NETWORK=vpn_net
      - DOCKER_ALLOWED_INCOMING_PORTS=8080,8191
      - PUID=${PUID}
      - PGID=${PGID}
      - VPN_PORT_FORWARDING=on
      # Current Gluetun releases keep the built-in DNS forwarder enabled; use encrypted upstreams.
      - DNS_UPSTREAM_RESOLVERS=cloudflare,google
      - HEALTH_SUCCESS_WAIT_DURATION=5s
      - FIREWALL_IPTABLES_LOG_LEVEL=debug
      - FIREWALL_INPUT_PORTS=8080,8191
      - FIREWALL_OUTBOUND_SUBNETS=${FIREWALL_OUTBOUND_SUBNETS}
      - BLOCK_MALICIOUS=off
      - BLOCK_ADS=off
      - BLOCK_SURVEILLANCE=off
    dns:
      - 127.0.0.11
    ports:
      - "8080:8080/tcp"    # qBittorrent Web UI
      - "8191:8191"        # flaresolverr (Prowlarr on bridge reaches this via host.docker.internal:8191)
    volumes:
      - /Users/zack/plex-docker/gluetun:/gluetun
      - /Users/zack/plex-docker/gluetun:/tmp/gluetun 
    networks:
      - vpn_net
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
    

  # ─── qBittorrent through VPN ─────────────────────────────────────────
  qbittorrent:
    image: linuxserver/qbittorrent
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - /Volumes/HomeLabPool:/data
      - /Users/zack/plex-docker/qbittorrent:/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "10", "http://127.0.0.1:8080/api/v2/app/version"]
      interval: 1m
      timeout: 15s
      retries: 3
      start_period: 45s
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: "service:gluetun"                  # stays inside the VPN
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "10", "http://127.0.0.1:8191/health"]
      interval: 1m
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  qb-port-sync:
    image: zkatancik/gluetun-qbittorrent-port-manager:latest
    container_name: qb-port-sync
    network_mode: "service:gluetun"                  # same net-ns as Qbit & Gluetun
    depends_on:
      - gluetun
      - qbittorrent
    environment:
      - PORT_FORWARDED=/tmp/gluetun/forwarded_port   # read the file Gluetun writes
      - QBITTORRENT_SERVER=${QBITTORRENT_SERVER}     # Qbit is localhost in-ns
      - QBITTORRENT_PORT=${QBITTORRENT_PORT}         # your WEBUI_PORT                     # default control-server port
      - RECHECK_TIME=60                              # seconds between checks
      - QBITTORRENT_USERNAME=${QBITTORRENT_USER}
      - QBITTORRENT_PASSWORD=${QBITTORRENT_PASS}
    volumes:
      - /Users/zack/plex-docker/gluetun:/tmp/gluetun:ro
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/gluetun/forwarded_port && pgrep -f '/bin/bash ./start.sh' >/dev/null"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: unless-stopped

  # ─── Sonarr (TV shows) ────────────────────────────────────────────────
  sonarr:
    image: linuxserver/sonarr
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /Users/zack/plex-docker/sonarr:/config
      - /Volumes/HomeLabPool:/data
    ports:
      - "8989:8989"
    networks:
      - default
      - vpn_net
    healthcheck:
      test: ["CMD-SHELL", "api_key=$$(grep -o '<ApiKey>[^<]*' /config/config.xml | cut -d '>' -f2) && test -n \"$$api_key\" && curl -fsS --max-time 10 -H \"X-Api-Key: $$api_key\" http://127.0.0.1:8989/api/v3/health | jq -e 'length == 0' >/dev/null"]
      interval: 1m
      timeout: 15s
      retries: 3
      start_period: 1m
    restart: unless-stopped

  # ─── Radarr (Movies) ──────────────────────────────────────────────────
  radarr:
    image: linuxserver/radarr
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /Users/zack/plex-docker/radarr:/config
      - /Volumes/HomeLabPool:/data
    ports:
      - "7878:7878"
    networks:
      - default
      - vpn_net
    healthcheck:
      test: ["CMD-SHELL", "api_key=$$(grep -o '<ApiKey>[^<]*' /config/config.xml | cut -d '>' -f2) && test -n \"$$api_key\" && curl -fsS --max-time 10 -H \"X-Api-Key: $$api_key\" http://127.0.0.1:7878/api/v3/health | jq -e 'length == 0' >/dev/null"]
      interval: 1m
      timeout: 15s
      retries: 3
      start_period: 1m
    restart: unless-stopped

  # ─── Bazarr (Subtitles) ───────────────────────────────────────────────
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /Users/zack/plex-docker/bazarr:/config
      - /Volumes/HomeLabPool:/data
    ports:
      - "6767:6767"
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "10", "http://127.0.0.1:6767/"]
      interval: 1m
      timeout: 15s
      retries: 3
      start_period: 1m
    restart: unless-stopped

  # ─── Unpackerr (Handles compressed downloads) ─────────────────────
  unpackerr:
    image: golift/unpackerr:latest
    container_name: unpackerr
    user: "${PUID}:${PGID}"
    networks:
      - vpn_net
    environment:
      - TZ=${TZ}
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_SONARR_0_PATH=/data/downloads
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
      - UN_RADARR_0_PATH=/data/downloads
    volumes:
      - /Users/zack/plex-docker/unpackerr:/config
      - /Volumes/HomeLabPool:/data
    healthcheck:
      # /proc reports the full process name; pgrep truncates it on this image.
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = unpackerr"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ─── Download cleanup (orphaned / superseded completed downloads) ───
  download-cleanup:
    image: zkatancik/download-cleanup:latest
    build:
      context: .
      dockerfile: containers/download-cleanup/Dockerfile
    container_name: download-cleanup
    depends_on:
      - qbittorrent
    environment:
      - TZ=${TZ}
      - CLEANUP_INTERVAL_SECONDS=21600
      - RETENTION_GUARD_INTERVAL_SECONDS=60
      - QUEUE_RECONCILE_INTERVAL_SECONDS=900
      - QUEUE_RECONCILE_GRACE_SECONDS=1800
      - SONARR_DETACHED_CATEGORY=sonarr-rejected
      - RADARR_DETACHED_CATEGORY=radarr-rejected
      - MIN_SEED_TIME_SECONDS=2592000
      - MAX_ACTIVE_DOWNLOADS=3
      - UNMATCHED_GRACE_SECONDS=2592000
      - RETENTION_STATE_PATH=/state/retention-state.json
      - QBITTORRENT_URL=http://host.docker.internal:8080
      - QBITTORRENT_USER=${QBITTORRENT_USER}
      - QBITTORRENT_PASS=${QBITTORRENT_PASS}
      - SONARR_URL=http://sonarr:8989
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_URL=http://radarr:7878
      - RADARR_API_KEY=${RADARR_API_KEY}
      - DOWNLOADS_PATH=/data/downloads/complete
      - MEDIA_TV_PATH=/data/Media/tv
      - MEDIA_MOVIES_PATH=/data/Media/movies
    volumes:
      - /Users/zack/plex-docker/download-cleanup:/state
      - /Volumes/HomeLabPool:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - com.centurylinklabs.watchtower.enable=false
    healthcheck:
      test: ["CMD", "/usr/local/bin/download-cleanup", "--guard", "--dry-run"]
      interval: 5m
      timeout: 90s
      retries: 2
      start_period: 30s
    restart: unless-stopped

  # ─── Recyclarr (Autofetch Sonarr and Radarr profiles) ---------------
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    user: "${PUID}:${PGID}"
    networks:
      - default
    volumes:
      - /Users/zack/plex-docker/recyclarr:/config   # holds YAML & backups
      - /Users/zack/plex-docker/containers/recyclarr/cron.sh:/cron.sh:ro
    environment:
      - TZ=America/Chicago
      - CRON_SCHEDULE= 0 3,15 * * *
      - SONARR_URL=http://sonarr:8989
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_URL=http://radarr:7878
      - RADARR_API_KEY=${RADARR_API_KEY}
    healthcheck:
      # Keep this read-only: Recyclarr config commands update the Trash Guides Git checkout.
      test: ["CMD-SHELL", "test -s /config/state/last-sync-success && now=$$(date +%s) && last=$$(cat /config/state/last-sync-success) && test $$((now - last)) -lt 46800"]
      interval: 1m
      timeout: 1m
      retries: 2
      start_period: 5m
    restart: unless-stopped

  # ─── Prowlarr (Indexer manager) ─────────────────────────────────────
  # Split routing: indexer HTTPS uses your normal network (default), not the VPN.
  # Prowlarr still hits all *enabled* indexers in parallel—fewer enabled indexers = less burst load.
  prowlarr:
    image: linuxserver/prowlarr
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /Users/zack/plex-docker/prowlarr:/config
    ports:
      - "9696:9696"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - vpn_net
    healthcheck:
      test: ["CMD-SHELL", "api_key=$$(grep -o '<ApiKey>[^<]*' /config/config.xml | cut -d '>' -f2) && test -n \"$$api_key\" && curl -fsS --max-time 10 -H \"X-Api-Key: $$api_key\" http://127.0.0.1:9696/api/v1/health | jq -e 'length == 0' >/dev/null"]
      interval: 1m
      timeout: 15s
      retries: 3
      start_period: 1m
    restart: unless-stopped

  # ─── Seerr (Requests UI) ────────────────────────────────────────────
  overseerr:
    image: overseerr:radarr-sonarr-priority
    build:
      # Seerr develop + Radarr/Sonarr availability priority compatibility fix.
      context: https://github.com/samohtxotom/seerr.git#ddc87450da16d246f206cd102d0f92d6c59b2498
      args:
        COMMIT_TAG: "ddc87450"
    container_name: overseerr
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
      - DISABLE_UPDATES=true
    volumes:
      - /Users/zack/plex-docker/overseerr:/app/config
    ports:
      - "5055:5055"
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "10", "-O", "/dev/null", "http://127.0.0.1:5055/api/v1/status"]
      interval: 1m
      timeout: 15s
      retries: 3
      start_period: 1m
    restart: unless-stopped

  # ─── Tautulli (Plex monitoring) ─────────────────────────────────────
  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /Users/zack/plex-docker/tautulli:/config
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "10", "http://127.0.0.1:8181/status"]
      interval: 1m
      timeout: 15s
      retries: 3
      start_period: 1m
    restart: unless-stopped

  # ─── Agregarr (Plex collections manager) ─────────────────────────────
  agregarr:
    image: agregarr-hardened:local
    build:
      context: .
      dockerfile: containers/agregarr/Dockerfile
    container_name: agregarr
    environment:
      - TZ=${TZ}
    volumes:
      - /Users/zack/plex-docker/agregarr:/app/config
      - /Users/zack/plex-docker/agregarr/yt-dlp.conf:/etc/yt-dlp.conf:ro
      - /Volumes/HomeLabPool/placeholders/movies:/data/movies
      - /Volumes/HomeLabPool/placeholders/tv:/data/tv
    ports:
      - "7171:7171"
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "10", "-O", "/dev/null", "http://127.0.0.1:7171/api/v1/status"]
      interval: 1m
      timeout: 15s
      retries: 3
      start_period: 1m
    restart: unless-stopped

  # ─── Trailer Post-Processor (watches for new trailers and converts to Apple TV format) ───
  trailer-processor:
    image: agregarr-hardened:local
    container_name: trailer-processor
    depends_on:
      - agregarr
    environment:
      - TZ=${TZ}
    volumes:
      - /Users/zack/plex-docker/agregarr:/app/config
      - /Volumes/HomeLabPool/placeholders/movies:/data/movies
      - /Volumes/HomeLabPool/placeholders/tv:/data/tv
    command: sh /app/config/trailer-watcher.sh
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '/app/config/trailer-watcher.sh' >/dev/null"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
