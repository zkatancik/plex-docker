# yaml-language-server: $schema=https://schemas.recyclarr.dev/latest/config-schema.json

# Recyclarr intentionally owns only the custom formats declared here. Existing
# quality membership, cutoffs, scores for other formats, and file-size limits
# remain unchanged.
sonarr:
  television:
    base_url: !env_var SONARR_URL http://sonarr:8989
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: false
    custom_formats:
      - trash_ids:
          - 85c61753df5da1fb2aab6f2a47426b09 # BR-DISK
        assign_scores_to:
          - name: 1080p HQ
            score: -10000
          - name: 4K HDR Preferred
            score: -10000
          - name: WEB-2160p
            score: -10000
          - name: WEB-1080p
            score: -10000
      - trash_ids:
          - 1bd69272e23c5e6c5b1d6c8a36fce95e # HFR
          - 15a05bc7c1a36e2b57fd628f8977e2fc # AV1
        assign_scores_to:
          - name: 1080p HQ
            score: -10000
          - name: 4K HDR Preferred
            score: -10000
          - name: WEB-2160p
            score: -10000
          - name: WEB-1080p
            score: -10000

radarr:
